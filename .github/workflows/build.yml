name: Build APK
on:
  workflow_dispatch: {}
  push:
    paths: ["app/**", ".github/**", "gradle/**"]
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: "34"
          build-tools: "34.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Write root build.gradle
        run: |
          printf '%s\n' \
            'buildscript {' \
            '    repositories { google(); mavenCentral() }' \
            '    dependencies { classpath "com.android.tools.build:gradle:8.1.4" }' \
            '}' > build.gradle
      - name: Write settings.gradle
        run: printf '%s\n' 'rootProject.name = "Cinder"' 'include ":app"' > settings.gradle
      - name: Write app/build.gradle
        run: |
          printf '%s\n' \
            'apply plugin: "com.android.application"' \
            'android {' \
            '    namespace "com.cinder.app"' \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.cinder.app"' \
            '        minSdk 26' \
            '        targetSdk 34' \
            '        versionCode 1' \
            '        versionName "1.6.0"' \
            '    }' \
            '    buildTypes { debug { minifyEnabled false } }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '}' > app/build.gradle
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

